# Builds the macOS installers (LIBRA-<version>-macOS-arm64.dmg and -x86_64.dmg) on GitHub's Macs.
# It runs when this file is pushed, when a tag such as v1.0.0 is pushed, or from the Actions tab
# ("Run workflow", once this file is on the default branch).
# The .dmg files appear under "Artifacts" on the run's page.
#
# Package versions are those of the Windows installer, so both ship the same solver.
name: macOS installer

on:
  workflow_dispatch:
  push:
    branches: ["**"]
    tags: ["v*"]                                       # tags ignore the paths filter
    paths: [".github/workflows/macos-installer.yml"]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14            # Apple silicon
            arch: arm64
          - runner: macos-15-intel      # Intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install packages
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy==2.4.1 pandas==3.0.0 highspy==1.15.1 matplotlib==3.10.8 \
            openpyxl==3.1.5 PySide6==6.11.1 pyinstaller==6.22.3 pillow pytest

      - name: Tests
        run: python -m pytest -q tests

      - name: Build, smoke test and package
        run: python installer/build.py

      - uses: actions/upload-artifact@v4
        with:
          name: LIBRA-macOS-${{ matrix.arch }}
          path: app/installer/output/*.dmg
          if-no-files-found: error
